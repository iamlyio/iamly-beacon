changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Security
      labels: [security]
    - title: Collectors
      labels: [collector]
    - title: Features
      labels: [enhancement]
    - title: Fixes
      labels: [bug]
    - title: Maintenance
      labels: [dependencies, documentation]
    - title: Other changes
      labels: ["*"]
