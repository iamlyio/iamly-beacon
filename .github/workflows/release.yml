name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          [[ "$RELEASE_TAG" == "v$version" ]]
          [[ "$(git cat-file -t "$RELEASE_TAG")" == "tag" ]]
          grep -Fq "## [$version]" CHANGELOG.md

      - name: Test
        run: make check

      - name: Scan Git history and working tree for secrets
        run: |
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 git . \
            --log-opts=--all --no-banner --redact \
            --gitleaks-ignore-path=.gitleaksignore
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 dir . \
            --no-banner --redact --gitleaks-ignore-path=.gitleaksignore

      - name: Build and verify artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          make release-snapshot
          make verify-release

      - name: Scan release artifacts for secrets
        run: |
          go run github.com/zricethezav/gitleaks/v8@v8.30.1 dir dist \
            --max-archive-depth=2 --no-banner --redact

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          awk -v heading="## [$version]" '
            $0 ~ /^## \[/ { if (found) exit; if (index($0, heading " ") == 1) { found=1; next } }
            found { print }
          ' CHANGELOG.md > release-notes.md
          [[ -s release-notes.md ]]

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "iamly Beacon $RELEASE_TAG" \
            --notes-file release-notes.md \
            --verify-tag
